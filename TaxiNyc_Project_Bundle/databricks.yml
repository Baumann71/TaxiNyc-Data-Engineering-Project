# This is a Databricks asset bundle definition for TaxiNyc_Project_Bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: TaxiNyc_Project_Bundle
  uuid: 5a07d860-69ea-446e-a768-642b9e36fa73

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  warehouse_id:
    description: WarehouseID
  pipeline_name:
    description: nombre del pipeline, depende del target
  environment:
    description: Entorno suffix

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-83008054-5d9f.cloud.databricks.com
    variables:
      catalog: taxis_project_dev
      warehouse_id: fed141f1a21c5b78
      pipeline_name: TaxiNyc_Pipeline_Dev
      environment: "_dev"
    presets:
      artifacts_dynamic_version: true
    
  prod:
    mode: production
    workspace:
      host: https://dbc-83008054-5d9f.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/lucabaumann.pm@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/[Prod]-TaxiNyc-Data-Engineering-Project
    variables:
      catalog: taxis_project_prod
      warehouse_id: fed141f1a21c5b78
      pipeline_name: TaxiNyc_Pipeline_Prod
      environment: "_prod"

    permissions:
      - user_name: lucabaumann.pm@gmail.com
        level: CAN_MANAGE
